# @package _global_

defaults:
  - override /synthesis_decoder: large
  - override /data: uspto
  - override /ph4_encoder: transformer

name: "ldm_USPTO_ph4_cond"

tags: ["LDM", "train", "full", "combined", "ph4", "latent_dim_16", "all_conformers", "USPTO"]

diffusion_module:
  # Provide on the CLI: diffusion_module.autoencoder_ckpt=/path/to/vae.ckpt
  autoencoder_ckpt: ???
  vocab_json: ${paths.data_dir}/synthesis_vocab_uspto.json
  denoiser:
    d_x: 16  # Must match autoencoder latent_dim
    use_conditioning: true
    dropout_prob: 0.2
  sampling:
    synthesis_top_k: 1
    beam_width: 1
    synthesis: false # setting to false because it is slow and does not work with multigpu
    synthesis_inference_method: "sample" # "sample" or "beam_search"
    do_rocs_metric: true
    use_cfg: false
    cfg_scale: 2.0
    do_posebusters: true
  ph4_dropout_enabled: true

autoencoder_module:
  latent_dim: 16

synthesis_decoder:
  params:
    conditioning_dim: 16

trainer:
  check_val_every_n_epoch: 35

data:
  do_pharmacophores: true
  use_all_conformers: true
