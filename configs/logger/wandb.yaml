# https://wandb.ai
# Weights & Biases logger configuration

wandb:
  _target_: lightning.pytorch.loggers.wandb.WandbLogger
  name: "${name}" # name of the run (normally generated by wandb if "")
  save_dir: "${paths.output_dir}"
  offline: False # set to True for offline logging
  id: null # pass correct id to resume experiment!
  anonymous: null # enable anonymous logging
  project: ${oc.env:WANDB_PROJECT,synlad} # wandb project name
  entity: ${oc.env:WANDB_ENTITY,null} # wandb username/team (null = default)
  log_model: False # upload lightning checkpoints ("all", "best", False)
  prefix: "" # prefix for metric keys
  group: "${name}" # group related runs together
  tags: ${tags} # inherit tags from main config
  job_type: "${task_name}" # job type for organization

  # Additional settings
  settings:
    _target_: wandb.Settings
    code_dir: "${paths.root_dir}" # track code changes
