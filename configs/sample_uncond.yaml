# @package _global_
#
# Unconditional sampling / evaluation for the latent diffusion model.
# Set DIR_NAME to the checkpoint directory you want to evaluate.

DIR_NAME: ???

defaults:
  - data: uspto  # Use molecule + synthesis pathway data
  - ph4_encoder: transformer  # Pharmacophore encoder configuration
  - synthesis_decoder: large
  - diffusion_module: ldm
  - callbacks: diffusion_default
  - logger: null
  - trainer: default
  - paths: default
  - extras: default
  - hydra: default
  - _self_

# Run name for logging
name: "diffusion_sampling_evaluation_unconditional"

# Task name determines output directory path
task_name: "sample_eval_diffusion"

# Tags for experiment identification
tags: ["sampling", "evaluation", "unconditional"]

# Provide checkpoint path to evaluate (REQUIRED)
ckpt_path: "${DIR_NAME}/last.ckpt"

interpolant:
  num_timesteps: 100

# Sampling configuration - these override model defaults
sampling:
  num_samples: 1000        # Total number of samples to generate
  batch_size: 100           # Sampling batch size
  cfg_scale: 0.5           # CFG scale for guidance (unused when use_cfg=false)
  visualize: true          # Save molecule visualizations
  save_dir: "${DIR_NAME}/eval_outputs/"  # Directory for outputs
  synthesis: true
  synthesis_inference_method: "beam_search" # "sample" or "beam_search"
  beam_width: 5
  synthesis_warper: "top_k" # "logits_to_log_probs" or "top_k"
  synthesis_top_k: 5
  use_cfg: false           # CFG is meaningless without conditioning
  do_rocs_metric: false
  do_rocs_for_syn: false
  compute_diversity: false
  diversity_fingerprint_type: "ECFP4"

vocab_json: ${paths.data_dir}/synthesis_vocab_uspto.json
rxn_server_url: ???

diffusion_module:
  denoiser:
    use_conditioning: false

# Results save directory for comprehensive metrics and config
results_save_dir: "${DIR_NAME}/eval_outputs/"

# Trainer configuration optimized for evaluation
trainer:
  _target_: lightning.Trainer
  accelerator: auto
  devices: 1               # Single device for evaluation
  precision: 32
  enable_checkpointing: false
  enable_progress_bar: true
  enable_model_summary: false
  logger: true

# Seed for reproducibility
seed: 42

# Data configuration for evaluation
data:
  pin_memory: false
  do_pharmacophores: false
  max_atoms: 40

# Hydra job configuration
hydra:
  job:
    chdir: false
  run:
    dir: ${paths.output_dir}/${task_name}/${now:%Y-%m-%d_%H-%M-%S}

# Diversity computation settings for per-conditioning analysis
diversity:
  enabled: true
  fingerprint_type: "ECFP4"
